proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 自动选优
    include-all-providers: true
    exclude-filter: (?i)🇨🇳|中国|cn|china|🇭🇰|香港|hk|claude|其他|未知|重置|更新|下次|刷新|机场|剩余|电报|期|页|官网|交流|群组|账号|无法
  - name: 自动选优
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 800
    timeout: 2000
    tolerance: 600
    max-failed-times: 3
    lazy: true
    include-all-providers: true
    exclude-filter: (?i)claude|104|162|172|s[0123]|s9999|\[ss\]|\[SS\]|xx|1x|ws|bgp|trojan|vmess|cloud|none|ikuuu|->|relay|🇭🇰|香港|hk|🇨🇳|中国|cn|china|其他|未知|重置|更新|下次|刷新|机场|剩余|电报|期|页|官网|交流|群组|账号|无法
  - name: 谷歌服务
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 900
    timeout: 3000
    tolerance: 600
    max-failed-times: 3
    lazy: true
    #proxies:
      #- 节点选择
      #- 自动选优
    include-all-providers: true
    filter: (?i)claude|google
    exclude-filter: (?i)vmess|relay|\[ss\]|\[SS\]|trojan
  - name: 国外媒体
    type: select
    proxies:
      - 节点选择
      - 自动选优
      - 全局直连
  - name: 微软服务
    type: select
    proxies:
      - 全局直连
      - 节点选择
      - 自动选优
  - name: 苹果服务
    type: select
    proxies:
      - 全局直连
      - 节点选择
      - 自动选优
  - name: 广告过滤
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 全局直连
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 自动选优
  - name: 全局拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 漏网之鱼
    type: select
    proxies:
      - 全局直连
      - 节点选择
      - 自动选优





